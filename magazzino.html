<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Magazzino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1c1c28;--border:#2a2a3d;
  --accent:#6c63ff;--red:#ff6584;--green:#00e5a0;--amber:#ffb347;
  --text:#e8e8f0;--muted:#6b6b85;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace;
  --r:16px;--rs:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.header{padding:52px 24px 16px;background:linear-gradient(180deg,#0d0d16 0%,transparent 100%)}
.eyebrow{font-family:var(--fm);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.title{font-family:var(--fh);font-size:28px;font-weight:800;letter-spacing:-0.5px}
.title span{color:var(--accent)}
.content{flex:1;padding:0 24px 110px;overflow-y:auto}
/* tabs */
.tab{display:none}.tab.active{display:block}
/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(10,10,15,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:8px 8px 28px;z-index:50}
.bitem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;transition:color .2s}
.bitem .ico{font-size:22px}
.bitem.active{color:var(--accent)}
/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.ctitle{font-family:var(--fh);font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px 10px;text-align:center}
.snum{font-family:var(--fm);font-size:22px;font-weight:500;line-height:1;margin-bottom:4px}
.slabel{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
/* buttons */
.btn{width:100%;padding:16px;border-radius:var(--rs);border:none;font-family:var(--fb);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text)}
.btn-green{background:rgba(0,229,160,.15);border:1px solid var(--green);color:var(--green)}
.btn-red{background:rgba(255,101,132,.15);border:1px solid var(--red);color:var(--red)}
.arow{display:flex;gap:8px}
.arow .btn{flex:1;padding:12px 8px;font-size:13px}
/* input */
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 14px;color:var(--text);font-family:var(--fb);font-size:13px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted)}
textarea.inp{resize:none;line-height:1.5}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap .inp{padding-left:38px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.edit-inp{background:var(--surface2);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;color:var(--text);font-family:var(--fm);font-size:13px;width:64px;outline:none;text-align:center}
/* inv */
.iitem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.iitem:last-child{border-bottom:none}
.idot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.iname{flex:1;font-size:13px;font-weight:500}
.isku{font-family:var(--fm);font-size:10px;color:var(--muted);margin-top:2px}
.iqty{font-family:var(--fm);font-size:16px;font-weight:500;text-align:right}
.iunit{font-size:10px;color:var(--muted)}
/* badge */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:10px;font-family:var(--fm);font-weight:500}
.badge-green{background:rgba(0,229,160,.12);color:var(--green)}
.badge-amber{background:rgba(255,179,71,.12);color:var(--amber)}
.badge-red{background:rgba(255,101,132,.12);color:var(--red)}
/* tag */
.tag{padding:3px 10px;border-radius:20px;font-size:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-family:var(--fm)}
/* table */
.rtable{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
.rtable th{font-family:var(--fm);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
.rtable td{padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
.rtable tr:last-child td{border-bottom:none}
/* voice */
.vwrap{display:flex;flex-direction:column;align-items:center;padding:24px 0 16px;gap:14px}
.vbtn{width:96px;height:96px;border-radius:50%;border:2px solid var(--red);background:rgba(255,101,132,.1);display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:all .2s;position:relative;-webkit-tap-highlight-color:transparent;user-select:none}
.vbtn.rec{background:rgba(255,101,132,.25);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,101,132,.4)}70%{box-shadow:0 0 0 22px rgba(255,101,132,0)}100%{box-shadow:0 0 0 0 rgba(255,101,132,0)}}
.vlabel{font-family:var(--fm);font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;text-align:center}
.tbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:14px;font-family:var(--fm);font-size:13px;color:var(--text);width:100%;min-height:60px;line-height:1.5;margin-bottom:12px}
/* divider */
.div{height:1px;background:var(--border);margin:14px 0}
.slabel{font-family:var(--fm);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--fm)}
/* upload */
.uzone{border:2px dashed var(--border);border-radius:var(--r);padding:32px 20px;text-align:center;cursor:pointer;background:rgba(108,99,255,.03)}
.uzone:active{border-color:var(--accent);background:rgba(108,99,255,.08)}
.uico{font-size:40px;margin-bottom:8px}
.utxt{font-size:14px;color:var(--muted);margin-bottom:4px}
.usub{font-size:11px;color:var(--muted);opacity:.6}
.imgprev{width:100%;border-radius:var(--rs);border:1px solid var(--border);max-height:220px;object-fit:cover;margin-bottom:12px}
/* spinner */
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:12px;font-family:var(--fm);z-index:200;max-width:340px;width:90%;word-break:break-word;text-align:center;animation:tin .3s ease;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* c */
.cg{color:var(--green)}.ca{color:var(--accent)}.cr{color:var(--red)}.cam{color:var(--amber)}
select.inp{appearance:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="eyebrow">Sistema Gestione</div>
    <h1 class="title">Magaz<span>zino</span></h1>
  </div>

  <div class="content">
    <!-- HOME -->
    <div id="tab-home" class="tab active"></div>
    <!-- CARICO -->
    <div id="tab-carico" class="tab"></div>
    <!-- SCARICO -->
    <div id="tab-scarico" class="tab"></div>
    <!-- INVENTARIO -->
    <div id="tab-inventario" class="tab"></div>
  </div>

  <nav class="bnav">
    <div class="bitem active" onclick="switchTab('home',this)"><span class="ico">🏠</span>Home</div>
    <div class="bitem" onclick="switchTab('carico',this)"><span class="ico">📦</span>Carico</div>
    <div class="bitem" onclick="switchTab('scarico',this)"><span class="ico">🎙️</span>Scarico</div>
    <div class="bitem" onclick="switchTab('inventario',this)"><span class="ico">📋</span>Inventario</div>
  </nav>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let inventory = [
  {id:1,name:"T-Shirt Basic Bianca",sku:"TSH-001-W",qty:45,unit:"pz",category:"Abbigliamento",low:10},
  {id:2,name:"Jeans Slim Fit Blu",sku:"JNS-002-B",qty:8,unit:"pz",category:"Abbigliamento",low:10},
  {id:3,name:"Scarpe Sneaker Nere",sku:"SCR-003-N",qty:22,unit:"pz",category:"Calzature",low:5},
  {id:4,name:"Borsa Pelle Marrone",sku:"BRS-004-M",qty:3,unit:"pz",category:"Accessori",low:5},
  {id:5,name:"Cappotto Invernale",sku:"CPT-005-G",qty:15,unit:"pz",category:"Abbigliamento",low:5},
  {id:6,name:"Cintura Cuoio",sku:"CNT-006-N",qty:30,unit:"pz",category:"Accessori",low:8},
];

// Persist to localStorage
function save(){try{localStorage.setItem('mag_inv',JSON.stringify(inventory))}catch(e){}}
function load(){try{const d=localStorage.getItem('mag_inv');if(d)inventory=JSON.parse(d)}catch(e){}}
load();

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.display='none',4000);
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.bitem').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  renderTab(name);
}

function renderTab(name){
  if(name==='home') renderHome();
  else if(name==='carico') renderCarico();
  else if(name==='scarico') renderScarico();
  else if(name==='inventario') renderInventario();
}

// ── HOME ───────────────────────────────────────────────────────────────────────
function renderHome(){
  const total=inventory.length;
  const totalQty=inventory.reduce((s,i)=>s+i.qty,0);
  const low=inventory.filter(i=>i.qty<=i.low);
  const top=[...inventory].sort((a,b)=>b.qty-a.qty).slice(0,3);
  let lowHtml='';
  if(low.length>0){
    lowHtml=`<div class="card">
      <div class="ctitle" style="color:var(--red)">⚠️ Scorte in esaurimento</div>
      ${low.map(i=>`<div class="iitem">
        <div class="idot" style="background:var(--red)"></div>
        <div style="flex:1"><div class="iname">${i.name}</div><div class="isku">${i.sku}</div></div>
        <div><div class="iqty cr">${i.qty}</div><div class="iunit">${i.unit}</div></div>
      </div>`).join('')}
    </div>`;
  }
  document.getElementById('tab-home').innerHTML=`
    <div class="stats">
      <div class="stat"><div class="snum ca">${total}</div><div class="slabel">Articoli</div></div>
      <div class="stat"><div class="snum cg">${totalQty}</div><div class="slabel">Unità</div></div>
      <div class="stat"><div class="snum ${low.length>0?'cr':'cg'}">${low.length}</div><div class="slabel">Scorte basse</div></div>
    </div>
    <div class="card">
      <div class="ctitle">⚡ Azioni rapide</div>
      <div class="arow" style="margin-bottom:10px">
        <button class="btn btn-primary" onclick="document.querySelectorAll('.bitem')[1].click()">📸 Carica DDT</button>
        <button class="btn btn-red" onclick="document.querySelectorAll('.bitem')[2].click()">🎙️ Scarico vocale</button>
      </div>
      <button class="btn btn-secondary" onclick="document.querySelectorAll('.bitem')[3].click()">📋 Inventario completo</button>
    </div>
    ${lowHtml}
    <div class="card">
      <div class="ctitle">📊 Più in stock</div>
      ${top.map(i=>`<div class="iitem">
        <div class="idot" style="background:var(--green)"></div>
        <div style="flex:1"><div class="iname">${i.name}</div><div class="isku">${i.sku}</div></div>
        <div><div class="iqty cg">${i.qty}</div><div class="iunit">${i.unit}</div></div>
      </div>`).join('')}
    </div>`;
}

// ── CARICO ─────────────────────────────────────────────────────────────────────
let caricoImage=null;
let caricoItems=[{id:1,name:'',sku:'',qty:1,unit:'pz',checked:true}];
let caricoFornitore='';let caricoNumDoc='';

function renderCarico(){
  const imgHtml=caricoImage
    ?`<div style="position:relative">
        <img src="${caricoImage}" class="imgprev">
        <button onclick="caricoImage=null;renderCarico()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;border-radius:50%;width:28px;height:28px;color:#fff;cursor:pointer;font-size:14px">✕</button>
      </div>`
    :`<div class="uzone" onclick="document.getElementById('ddtFile').click()">
        <div class="uico">📄</div>
        <div class="utxt">Tocca per fotografare il DDT</div>
        <div class="usub">Opzionale — puoi anche inserire direttamente</div>
      </div>`;

  const rowsHtml=caricoItems.map((item,idx)=>`
    <div style="border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <input type="checkbox" ${item.checked?'checked':''} onchange="caricoItems[${idx}].checked=this.checked" style="accent-color:var(--accent);width:16px;height:16px">
        <span style="font-family:var(--fm);font-size:11px;color:var(--muted)">#${idx+1}</span>
        ${caricoItems.length>1?`<button onclick="caricoRemoveRow(${item.id})" style="margin-left:auto;background:none;border:none;color:var(--red);cursor:pointer;font-size:16px">🗑</button>`:''}
      </div>
      <input class="inp" style="margin-bottom:8px" placeholder="Nome articolo *" value="${item.name}"
        oninput="caricoItems[${idx}].name=this.value">
      <div style="display:flex;gap:8px">
        <input class="inp" style="flex:2;padding:9px 10px" placeholder="SKU (opz.)" value="${item.sku}"
          oninput="caricoItems[${idx}].sku=this.value">
        <input class="edit-inp" type="number" min="1" value="${item.qty}" style="flex:1;width:auto"
          oninput="caricoItems[${idx}].qty=parseInt(this.value)||1">
        <select class="inp" style="flex:1;padding:0 6px;font-family:var(--fm);font-size:11px" onchange="caricoItems[${idx}].unit=this.value">
          ${['pz','kg','mt','lt','cf','sc'].map(u=>`<option ${item.unit===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
    </div>`).join('');

  const valid=caricoItems.filter(i=>i.checked&&i.name.trim()).length;

  document.getElementById('tab-carico').innerHTML=`
    <div class="card">
      <div class="ctitle">📸 Foto Documento di Trasporto</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5">Scatta la foto del DDT come riferimento, poi inserisci gli articoli qui sotto.</p>
      ${imgHtml}
      <input type="file" id="ddtFile" accept="image/*" capture="environment" style="display:none" onchange="caricoHandleFile(this)">
    </div>
    <div class="card">
      <div class="ctitle">📋 Dati documento</div>
      <div style="display:flex;gap:10px">
        <div style="flex:1">
          <div class="slabel" style="margin-bottom:5px">Fornitore</div>
          <input class="inp" style="padding:10px 12px" placeholder="Es. Rossi Srl" value="${caricoFornitore}" oninput="caricoFornitore=this.value">
        </div>
        <div style="flex:1">
          <div class="slabel" style="margin-bottom:5px">N° DDT</div>
          <input class="inp" style="padding:10px 12px" placeholder="Es. 2024/001" value="${caricoNumDoc}" oninput="caricoNumDoc=this.value">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ctitle">📦 Articoli da caricare</div>
      ${rowsHtml}
      <button class="btn btn-secondary" onclick="caricoAddRow()" style="margin-bottom:12px">+ Aggiungi articolo</button>
      <button class="btn btn-green" onclick="caricoConfirm()" ${valid===0?'disabled':''}>✅ Conferma carico (${valid} articoli)</button>
    </div>`;
}

function caricoHandleFile(input){
  const file=input.files[0];
  if(!file)return;
  caricoImage=URL.createObjectURL(file);
  renderCarico();
}
function caricoAddRow(){
  caricoItems.push({id:Date.now(),name:'',sku:'',qty:1,unit:'pz',checked:true});
  renderCarico();
}
function caricoRemoveRow(id){
  caricoItems=caricoItems.filter(i=>i.id!==id);
  renderCarico();
}
function autoSku(name){
  const w=name.trim().toUpperCase().split(/\s+/);
  return w.slice(0,2).map(x=>x.slice(0,3)).join('-')+'-'+String(Math.floor(Math.random()*900)+100);
}
function caricoConfirm(){
  const valid=caricoItems.filter(i=>i.checked&&i.name.trim());
  if(valid.length===0){toast('⚠️ Aggiungi almeno un articolo');return;}
  valid.forEach(newItem=>{
    const sku=newItem.sku.trim()||autoSku(newItem.name);
    const idx=inventory.findIndex(i=>i.sku.toLowerCase()===sku.toLowerCase()||i.name.toLowerCase()===newItem.name.toLowerCase());
    if(idx>=0){
      inventory[idx].qty+=Number(newItem.qty);
    }else{
      inventory.push({id:Date.now()+Math.random(),name:newItem.name.trim(),sku,qty:Number(newItem.qty),unit:newItem.unit||'pz',category:'Altro',low:5});
    }
  });
  save();
  toast(`✅ Caricati ${valid.length} articoli`);
  caricoImage=null;caricoFornitore='';caricoNumDoc='';
  caricoItems=[{id:1,name:'',sku:'',qty:1,unit:'pz',checked:true}];
  document.getElementById('tab-carico').innerHTML=`
    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:52px;margin-bottom:12px">✅</div>
      <div style="font-family:var(--fh);font-size:20px;font-weight:700;margin-bottom:8px">Carico completato!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:24px">Magazzino aggiornato</div>
      <button class="btn btn-secondary" onclick="renderCarico()">+ Carica altro DDT</button>
    </div>`;
}

// ── SCARICO ─────────────────────────────────────────────────────────────────────
let scarRec=null;
let scarRecording=false;
let scarTranscript='';
let scarFinalText='';
let scarTimer=null;
let scarSeconds=0;
let scarResult=null;

function renderScarico(){
  const chips=['scarica 5 t-shirt bianche','togli 2 jeans slim','scarica 3 scarpe nere e 1 borsa','rimuovi 10 cinture'];
  const chipsHtml=chips.map(c=>`<div class="chip" onclick="scarSetText('${c}')">${c}</div>`).join('');

  document.getElementById('tab-scarico').innerHTML=`
    <div class="card">
      <div class="ctitle">🎙️ Scarico Vocale</div>
      <p style="font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6">
        Tocca il microfono e parla. Oppure digita in linguaggio naturale.
      </p>
      <div class="vwrap">
        <div class="vbtn" id="vbtn" onclick="scarToggle()">🎤</div>
        <div class="vlabel" id="vlabel">Tocca per parlare</div>
        <div id="vinterim" style="font-size:12px;color:var(--muted);font-style:italic;text-align:center;min-height:20px"></div>
      </div>
      <div class="div"></div>
      <div class="slabel">Testo (modifica se necessario)</div>
      <textarea class="inp" id="scarText" rows="3" style="height:80px;margin-bottom:12px" placeholder='Es. "scarica 5 t-shirt bianche e 2 jeans"'>${scarTranscript}</textarea>
      <div class="chips">${chipsHtml}</div>
      <button class="btn btn-primary" onclick="scarAnalyze()" id="scarBtn">🧠 Interpreta e scarica</button>
    </div>
    <div id="scarResult"></div>`;

  // Re-attach textarea sync
  const ta=document.getElementById('scarText');
  if(ta) ta.addEventListener('input',function(){scarTranscript=this.value;});
}

function scarSetText(t){
  scarTranscript=t;
  const ta=document.getElementById('scarText');
  if(ta){ta.value=t;ta.addEventListener('input',function(){scarTranscript=this.value;})}
}

function scarToggle(){
  if(scarRecording) scarStop();
  else scarStart();
}

function scarStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('⚠️ Usa Safari su iPhone per il riconoscimento vocale');return;}

  scarFinalText='';
  scarTranscript='';
  const ta=document.getElementById('scarText');
  if(ta) ta.value='';

  const rec=new SR();
  rec.lang='it-IT';
  rec.continuous=false;
  rec.interimResults=true;
  rec.maxAlternatives=1;

  rec.onstart=()=>{
    scarRecording=true;
    scarSeconds=0;
    clearInterval(scarTimer);
    scarTimer=setInterval(()=>{
      scarSeconds++;
      const lb=document.getElementById('vlabel');
      if(lb) lb.textContent=`⏺ ${String(Math.floor(scarSeconds/60)).padStart(2,'0')}:${String(scarSeconds%60).padStart(2,'0')} — tocca per fermare`;
    },1000);
    const btn=document.getElementById('vbtn');
    if(btn){btn.textContent='⏹';btn.classList.add('rec')}
  };

  rec.onresult=(e)=>{
    let interim='';
    let final=scarFinalText;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=(final?' ':'')+t;
      else interim+=t;
    }
    scarFinalText=final;
    scarTranscript=final||interim;
    const ta=document.getElementById('scarText');
    if(ta) ta.value=scarTranscript;
    const vi=document.getElementById('vinterim');
    if(vi) vi.textContent=interim?`"${interim}…"`:'' ;
  };

  rec.onerror=(e)=>{
    scarStop();
    if(e.error==='not-allowed') toast('⚠️ Permesso microfono negato — vai in Impostazioni > Safari > Microfono');
    else toast('⚠️ Errore: '+e.error);
  };

  rec.onend=()=>{ scarStop(); };

  scarRec=rec;
  try{ rec.start(); }catch(e){ toast('⚠️ Impossibile avviare: '+e.message); }
}

function scarStop(){
  clearInterval(scarTimer);
  scarRecording=false;
  try{if(scarRec) scarRec.stop();}catch(e){}
  const btn=document.getElementById('vbtn');
  if(btn){btn.textContent='🎤';btn.classList.remove('rec')}
  const lb=document.getElementById('vlabel');
  if(lb) lb.textContent=scarTranscript?'✓ Toccami per ripetere':'Tocca per parlare';
  const vi=document.getElementById('vinterim');
  if(vi) vi.textContent='';
}

// Parser locale NLP
function parseCommand(cmd){
  const lower=cmd.toLowerCase();
  const segs=lower
    .replace(/\b(scarica|togli|rimuovi|elimina|leva|dammi|prenota)\b/g,'')
    .split(/\s*,\s*|\s+e\s+/)
    .map(s=>s.trim()).filter(Boolean);

  const matched=[];const errors=[];
  for(const seg of segs){
    const numMatch=seg.match(/(\d+)/);
    const qty=numMatch?parseInt(numMatch[1]):1;
    const descRaw=seg.replace(/\d+/,'').trim();
    if(!descRaw) continue;
    const tokens=descRaw.split(/\s+/).filter(w=>w.length>2);
    let bestItem=null;let bestScore=0;
    for(const item of inventory){
      const hay=(item.name+' '+item.sku+' '+item.category).toLowerCase();
      let score=0;
      for(const tok of tokens) if(hay.includes(tok)) score+=tok.length;
      if(score>bestScore){bestScore=score;bestItem=item;}
    }
    if(bestItem&&bestScore>=3){
      matched.push({sku:bestItem.sku,name:bestItem.name,qty_richiesta:qty,qty_disponibile:bestItem.qty,ok:qty<=bestItem.qty});
      if(qty>bestItem.qty) errors.push(`${bestItem.name}: richiesti ${qty}, disponibili ${bestItem.qty}`);
    }else{
      errors.push(`Non trovato: "${descRaw}"`);
    }
  }
  return{
    interpretazione:matched.length>0?`Trovati ${matched.length} articolo/i`:'Nessun articolo riconosciuto',
    items:matched,errori:errors
  };
}

function scarAnalyze(){
  const t=(scarTranscript||'').trim();
  if(!t){toast('⚠️ Scrivi o pronuncia cosa vuoi scaricare');return;}
  scarResult=parseCommand(t);
  if(scarResult.items.length===0){
    toast('⚠️ Nessun articolo trovato — prova parole più simili al nome');
  }
  renderScarResult();
}

function renderScarResult(){
  const r=scarResult;
  if(!r) return;
  const errHtml=r.errori.length>0?`<div style="background:rgba(255,101,132,.08);border:1px solid rgba(255,101,132,.2);border-radius:8px;padding:10px 12px;margin-bottom:12px">${r.errori.map(e=>`<div style="font-size:11px;color:var(--red)">⚠️ ${e}</div>`).join('')}</div>`:'';
  const validCount=r.items.filter(i=>i.ok&&i.qty_richiesta<=i.qty_disponibile).length;
  document.getElementById('scarResult').innerHTML=`
    <div class="card">
      <div class="ctitle">📋 Articoli da scaricare</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;font-style:italic;background:var(--surface2);border-radius:8px;padding:8px 12px">💬 "${r.interpretazione}"</div>
      <table class="rtable">
        <thead><tr><th>Articolo</th><th>Scarico</th><th>Stato</th></tr></thead>
        <tbody>${r.items.map(item=>{
          const ok=item.ok&&item.qty_richiesta<=item.qty_disponibile;
          return`<tr>
            <td><div style="font-size:12px;font-weight:500">${item.name}</div><div style="font-size:10px;color:var(--muted);font-family:var(--fm)">${item.sku}</div></td>
            <td><span style="font-family:var(--fm);font-size:15px;color:${ok?'var(--red)':'var(--muted)'}">-${item.qty_richiesta}</span><div style="font-size:10px;color:var(--muted)">disp. ${item.qty_disponibile}</div></td>
            <td><span class="badge ${ok?'badge-green':'badge-amber'}">${ok?'✓ OK':'⚠️ No'}</span></td>
          </tr>`;}).join('')}</tbody>
      </table>
      ${errHtml}
      <div class="arow">
        <button class="btn btn-red" onclick="scarConfirm()" ${validCount===0?'disabled':''}>✅ Conferma scarico (${validCount})</button>
        <button class="btn btn-secondary" style="flex:0 0 auto;padding:12px 14px" onclick="scarReset()">✕</button>
      </div>
    </div>`;
}

function scarConfirm(){
  const valid=scarResult.items.filter(i=>i.ok&&i.qty_richiesta<=i.qty_disponibile);
  valid.forEach(item=>{
    const idx=inventory.findIndex(i=>i.sku===item.sku);
    if(idx>=0) inventory[idx].qty-=item.qty_richiesta;
  });
  save();
  toast(`✅ Scaricati ${valid.length} articoli`);
  scarReset();
  document.getElementById('scarResult').innerHTML=`
    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:52px;margin-bottom:12px">✅</div>
      <div style="font-family:var(--fh);font-size:20px;font-weight:700;margin-bottom:8px">Scarico completato!</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:24px">Magazzino aggiornato</div>
      <button class="btn btn-secondary" onclick="renderScarico()">+ Nuovo scarico</button>
    </div>`;
}

function scarReset(){
  scarTranscript='';scarFinalText='';scarResult=null;
  const ta=document.getElementById('scarText');
  if(ta) ta.value='';
  document.getElementById('scarResult').innerHTML='';
}

// ── INVENTARIO ──────────────────────────────────────────────────────────────────
let invSearch='';let invEditId=null;let invEditQty=0;

function renderInventario(){
  const filtered=inventory.filter(i=>
    i.name.toLowerCase().includes(invSearch.toLowerCase())||
    i.sku.toLowerCase().includes(invSearch.toLowerCase())||
    i.category.toLowerCase().includes(invSearch.toLowerCase())
  );
  const rows=filtered.map(item=>{
    const isLow=item.qty<=item.low;
    const dc=item.qty===0?'var(--red)':isLow?'var(--amber)':'var(--green)';
    const qtyCell=invEditId===item.id
      ?`<div style="display:flex;gap:6px;align-items:center">
          <input class="edit-inp" id="editInp" type="number" value="${invEditQty}" min="0" style="width:60px">
          <button onclick="invSave(${item.id})" style="background:var(--green);border:none;border-radius:6px;color:#000;padding:4px 8px;cursor:pointer;font-size:12px">✓</button>
          <button onclick="invEditId=null;renderInventario()" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 8px;cursor:pointer;font-size:12px">✕</button>
        </div>`
      :`<div style="display:flex;align-items:center;gap:10px">
          <div style="text-align:right"><div class="iqty" style="color:${dc}">${item.qty}</div><div class="iunit">${item.unit}</div></div>
          <button onclick="invStartEdit(${item.id},${item.qty})" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 8px;cursor:pointer;font-size:14px">✎</button>
        </div>`;
    return`<div class="iitem">
      <div class="idot" style="background:${dc}"></div>
      <div style="flex:1">
        <div class="iname">${item.name}</div>
        <div class="isku">${item.sku} · ${item.category}</div>
        ${isLow?'<span class="badge badge-amber" style="margin-top:4px">Scorte basse</span>':''}
      </div>
      ${qtyCell}
    </div>`;
  }).join('');

  document.getElementById('tab-inventario').innerHTML=`
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input class="inp" placeholder="Cerca per nome, SKU, categoria…" value="${invSearch}" oninput="invSearch=this.value;renderInventario()">
    </div>
    <div class="card">
      <div class="ctitle">📦 Tutti gli articoli <span style="color:var(--muted);font-weight:400">(${filtered.length})</span></div>
      ${rows||'<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">Nessun articolo trovato</div>'}
    </div>`;
  if(invEditId){
    const inp=document.getElementById('editInp');
    if(inp){inp.focus();inp.addEventListener('input',function(){invEditQty=parseInt(this.value)||0});}
  }
}

function invStartEdit(id,qty){invEditId=id;invEditQty=qty;renderInventario();}
function invSave(id){
  const idx=inventory.findIndex(i=>i.id===id);
  if(idx>=0){inventory[idx].qty=invEditQty;save();}
  invEditId=null;renderInventario();toast('✅ Quantità aggiornata');
}

// ── Init ───────────────────────────────────────────────────────────────────────
renderHome();
</script>
